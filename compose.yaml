services:
  dbMongo:
    image: mongo:7
    container_name: dbMongo
    networks:
      - firstNetwork
    volumes:
      - mongo-data:/data/db
    command: mongod --replSet rs0
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'dbMongo:27017'}]}) }; if (!db.hello().isWritablePrimary) quit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5
  myApp:
    build: .
    image: subscription-tracker
    container_name: myApp
    networks:
      - firstNetwork
    ports:
      - "5500:5500"
    env_file: .env.docker.local
    depends_on:
      dbMongo: 
        condition: service_healthy
networks:
  firstNetwork:

volumes:
  mongo-data:

